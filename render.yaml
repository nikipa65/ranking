# Bauplan für Render: New → Blueprint → dieses Repository wählen.
#
# Ein Dienst genügt – der Node-Server liefert API und PWA unter derselben Adresse aus.
# Die Daten liegen dauerhaft in MongoDB Atlas (Datenbank/Collection "data-dr"),
# weil das Dateisystem im kostenlosen Render-Plan bei jedem Neustart gelöscht wird.
services:
  - type: web
    name: dakle-ranking
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Verbindungsadresse von MongoDB Atlas (Connect → Drivers → Node.js), z. B.
      # mongodb+srv://benutzer:passwort@cluster0.xxxxx.mongodb.net/?retryWrites=true&w=majority
      # `sync: false` heißt: Render fragt den Wert beim Anlegen ab und legt ihn nicht im Repository ab.
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: data-dr
      - key: MONGODB_COLLECTION
        value: data-dr
      # Optional: Name des Profils, das die Städte bearbeiten darf (leer = ältestes Profil).
      - key: ADMIN
        sync: false
