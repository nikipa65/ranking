<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>dakle-Ranking</title>
  <meta name="description" content="Upiši svaki dan prijeđene kilometre – poredak se zbraja automatski.">
  <meta name="theme-color" content="#1e40af">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="dakle-Ranking">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="32" height="32">
      <span>dakle-Ranking</span>
    </div>
    <button type="button" class="sync-chip" id="syncStatus" aria-live="polite"></button>
    <div class="me-area" id="meArea"></div>
  </header>

  <main class="layout">
    <section class="card board" aria-label="Unos kilometara">
      <nav class="day-pager" aria-label="Odabir dana">
        <button type="button" class="tri-btn prev" id="prevDay" aria-label="Prethodni dan"></button>
        <div class="day-info">
          <strong id="dayLabel">–</strong>
          <span id="daySub"></span>
        </div>
        <button type="button" class="tri-btn next" id="nextDay" aria-label="Sljedeći dan"></button>
      </nav>
      <div class="today-row">
        <button type="button" class="btn today-btn" id="todayBtn" title="Skoči na današnji dan">📅 Danas</button>
      </div>
      <p class="hint" id="dayHint"></p>
      <ul class="km-list" id="kmList"></ul>
    </section>

    <aside class="card ranking" aria-labelledby="rankTitle">
      <div class="ranking-head">
        <h2 id="rankTitle">Poredak 2026.</h2>
      </div>
      <table class="rank-table">
        <thead>
          <tr><th>#</th><th>Ime</th><th class="num">Dani</th><th class="num">Bodovi</th></tr>
        </thead>
        <tbody id="rankBody"></tbody>
      </table>
      <p class="hint small">1 bod po kilometru. Zbrajaju se svi dani, kod istog broja bodova abecedno.</p>
    </aside>
  </main>

  <!-- Gerät einmalig einem Namen zuordnen -->
  <dialog id="claimDialog">
    <div class="dialog-form">
      <button type="button" class="dialog-x" data-close aria-label="Zatvori" title="Zatvori">&times;</button>
      <h2 id="claimTitle">Tko si ti?</h2>
      <div id="claimBody"></div>
      <p class="form-error" aria-live="polite"></p>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="app.js"></script>
</body>
</html>
